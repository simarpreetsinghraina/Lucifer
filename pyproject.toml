
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lucifer-assistant"
version = "0.1.0"
description = "A modular personal AI desktop assistant."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.12.0",
    ""psutil==7.2.2"
]

[project.scripts]
lucifer = "lucifer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
